name: Render SOLO THERAPY Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Render video
      run: npm run render
      env:
        FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: solo-therapy-labor-day
        path: out/solo-therapy-labor-day.mp4
