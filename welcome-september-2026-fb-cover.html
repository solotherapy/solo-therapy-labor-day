<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Welcome September 2026 Facebook Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@700;800&family=Nunito:ital,wght@0,800;0,900;1,800;1,900&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1640px; height: 624px; overflow: hidden; }
  .banner {
    position: relative; width: 1640px; height: 624px; overflow: hidden;
    background:
      radial-gradient(480px 330px at 34% 58%, rgba(140,198,110,0.28), transparent 72%),
      linear-gradient(105deg, #0c4636 0%, #135843 30%, #1e6b50 55%, #35845f 75%, #5fac7f 92%, #7fc296 100%);
    font-family: "Nunito", "Segoe UI", sans-serif;
  }

  .photo {
    position: absolute; top: 0; right: 0; width: 800px; height: 624px;
    background: url("sky-heart-leaf.jpg") no-repeat 64% 50%;
    background-size: cover;
    filter: saturate(1.45) contrast(1.03);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.55) 22%, #000 38%);
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.55) 22%, #000 38%);
  }

  .deco { position: absolute; inset: 0; }

  .logo-tab {
    position: absolute; top: 0; left: 0;
    background: #ffffff; border-radius: 0 0 30px 0;
    padding: 14px 22px 17px 18px;
    box-shadow: 0 6px 16px rgba(6, 40, 26, 0.35);
  }
  .logo-tab img { height: 76px; width: auto; display: block; }

  .ol { position: relative; z-index: 0; display: inline-block; }
  .ol::before {
    content: attr(data-text); position: absolute; inset: 0; z-index: -1;
    -webkit-text-stroke: 12px #5aa53e;
    text-shadow: 0 10px 20px rgba(6, 45, 22, 0.55);
  }

  .headline { position: absolute; left: 130px; top: 64px; transform: rotate(-4deg); }
  .w1, .w2 {
    font-family: "Pacifico", "Brush Script MT", cursive; color: #ffffff;
    line-height: 1.22; margin: 0;
  }
  .w1 { font-size: 104px; }
  .w2 { font-size: 92px; margin: -12px 0 0 76px; }

  .offer { position: absolute; left: 140px; top: 352px; display: flex; align-items: center; gap: 20px; }
  .pct {
    font-family: "Baloo 2", "Arial Rounded MT Bold", sans-serif; font-weight: 800;
    font-size: 126px; line-height: 1; color: #ffffff;
  }
  .pct.ol::before { -webkit-text-stroke: 13px #5aa53e; }
  .hibiscus { width: 64px; height: 64px; margin-top: 26px; }
  .offer-col { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; }
  .off-store {
    font-family: "Nunito", sans-serif; font-style: italic; font-weight: 900;
    font-size: 54px; line-height: 1; color: #d9ea62; letter-spacing: 0.01em;
  }
  .off-store.ol::before { -webkit-text-stroke: 8px #2d7136; }
  .coupon {
    align-self: flex-start;
    background: linear-gradient(90deg, #e4f0a4 0%, #b7d766 55%, #9cc84e 100%);
    border-radius: 6px; padding: 8px 22px 10px 16px;
    font-style: italic; font-weight: 900; font-size: 34px; line-height: 1;
    box-shadow: 0 6px 14px rgba(6, 45, 22, 0.35);
  }
  .coupon .lbl { color: #d9a514; padding-right: 10px; }
  .coupon .code { color: #14502e; font-style: normal; letter-spacing: 0.05em; }

  .pills { position: absolute; left: 140px; bottom: 26px; display: flex; gap: 16px; }
  .pill {
    background: #124e37; color: #ffffff;
    font-style: italic; font-weight: 800; font-size: 27px; line-height: 1;
    padding: 11px 20px 13px; border-radius: 8px;
    box-shadow: 0 5px 12px rgba(6, 40, 26, 0.4);
  }
</style>
</head>
<body>
<div class="banner">
  <div class="photo"></div>

  <svg class="deco" viewBox="0 0 1640 624" fill="none" aria-hidden="true">
    <defs>
      <g id="pleaf" stroke-linecap="round" fill="none">
        <path d="M0 0 C14 -50 14 -150 0 -200 C-14 -150 -14 -50 0 0 Z"/>
        <path d="M0 0 C40 -40 70 -110 74 -168 C30 -130 6 -60 0 0 Z"/>
        <path d="M0 0 C-40 -40 -70 -110 -74 -168 C-30 -130 -6 -60 0 0 Z"/>
        <path d="M0 0 C56 -20 96 -66 110 -116 C58 -92 18 -40 0 0 Z"/>
        <path d="M0 0 C-56 -20 -96 -66 -110 -116 C-58 -92 -18 -40 0 0 Z"/>
        <path d="M0 0 C58 6 96 -8 122 -40 C76 -40 26 -18 0 0 Z"/>
        <path d="M0 0 C-58 6 -96 -8 -122 -40 C-76 -40 -26 -18 0 0 Z"/>
        <path d="M0 0 L0 56"/>
      </g>
    </defs>
    <use href="#pleaf" transform="translate(900 200) scale(1.15) rotate(24)" stroke="#a8d693" opacity="0.15" stroke-width="4"/>
    <use href="#pleaf" transform="translate(700 560) scale(0.9) rotate(-18)" stroke="#a8d693" opacity="0.13" stroke-width="4"/>
    <use href="#pleaf" transform="translate(290 600) scale(1.05) rotate(12)" stroke="#a8d693" opacity="0.10" stroke-width="4"/>
    <use href="#pleaf" transform="translate(1560 110) scale(0.95) rotate(150)" stroke="#ffffff" opacity="0.45" stroke-width="3"/>
    <circle cx="40" cy="380" r="150" stroke="#a8d693" opacity="0.10" stroke-width="3"/>
    <circle cx="40" cy="380" r="112" stroke="#a8d693" opacity="0.08" stroke-width="3"/>
  </svg>

  <div class="logo-tab"><img src="solo-therapy-logo.png" alt="Solo Therapy"></div>

  <div class="headline">
    <p class="w1"><span class="ol" data-text="Welcome">Welcome</span></p>
    <p class="w2"><span class="ol" data-text="September 2026!">September 2026!</span></p>
  </div>

  <div class="offer">
    <span class="pct ol" data-text="15%">15%</span>
    <svg class="hibiscus" viewBox="-60 -60 120 120" aria-hidden="true">
      <g>
        <g fill="#ec5b7e" stroke="#c93a5e" stroke-width="2">
          <ellipse cx="0" cy="-30" rx="21" ry="31"/>
          <ellipse cx="0" cy="-30" rx="21" ry="31" transform="rotate(72)"/>
          <ellipse cx="0" cy="-30" rx="21" ry="31" transform="rotate(144)"/>
          <ellipse cx="0" cy="-30" rx="21" ry="31" transform="rotate(216)"/>
          <ellipse cx="0" cy="-30" rx="21" ry="31" transform="rotate(288)"/>
        </g>
        <circle cx="0" cy="0" r="10" fill="#b8264c"/>
        <line x1="0" y1="0" x2="26" y2="-34" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/>
        <circle cx="26" cy="-34" r="5" fill="#f2c94c"/>
        <circle cx="18" cy="-40" r="3.5" fill="#f2c94c"/>
        <circle cx="32" cy="-26" r="3.5" fill="#f2c94c"/>
      </g>
    </svg>
    <div class="offer-col">
      <span class="off-store ol" data-text="Off Entire Store">Off Entire Store</span>
      <div class="coupon"><span class="lbl">Coupon Code:</span><span class="code">MORINGA</span></div>
    </div>
  </div>

  <div class="pills">
    <div class="pill">Herbal Therapy</div>
    <div class="pill">Rituals Therapy</div>
    <div class="pill">Essential Oil Therapy</div>
    <div class="pill">Candles</div>
  </div>
</div>
</body>
</html>
